name: jump_counter
description: Aplicación para contar saltos usando el acelerómetro
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^3.0.0
  share_plus: ^7.0.0
  cupertino_icons: ^1.0.2
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/jump_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon/jump_icon_foreground.png"
